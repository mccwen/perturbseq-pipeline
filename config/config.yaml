project:
  name: "genentech_perturbseq_interview"
  organism: "human"
  genome: "GRCh38"

paths:
  samples: "config/samples.csv"
  guides: "config/guides_reference.csv"
  cell_annotations: "config/cell_annotations.yml"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  results_dir: "results/final_reports"

qc:
  min_counts: 500
  min_genes: 200
  max_mito_fraction: 0.20
  doublet_score_threshold: 0.25
  highly_variable_genes: 3000

guide_assignment:
  min_umi: 3
  min_fraction: 0.60
  max_guides_per_cell: 2
  non_targeting_label: "NT"

batch:
  covariates: ["donor", "batch", "condition"]
  integration_for_visualization_only: true

mixscape:
  enabled: true
  perturbed_probability_threshold: 0.70

pseudobulk:
  groupby: ["donor", "batch", "condition", "cell_type", "target_gene"]
  min_cells_per_group: 3

differential_expression:
  method: "edgeR_QLF"
  design: "~ donor + batch + condition + target_gene"
  contrast_column: "target_gene"

reports:
  top_n_genes: 25
