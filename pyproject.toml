[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perturbseq-pipeline"
version = "0.1.0"
description = "Post-Cell Ranger low-MOI Perturb-seq analysis workflow."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Crystal Wen" }]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scipy>=1.11,<2",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "anndata>=0.10",
  "scanpy>=1.10",
  "scrublet>=0.2.3"
]

[project.optional-dependencies]
workflow = ["snakemake>=9,<10"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
perturbseq-pipeline = "perturbseq_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
