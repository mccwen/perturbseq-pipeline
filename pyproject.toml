[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perturbseq-pipeline"
version = "0.1.0"
description = "Reproducible Perturb-seq / CROP-seq analysis pipeline."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ming-Ching Wen" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "seaborn>=0.13"
]

[project.optional-dependencies]
single-cell = [
  "anndata>=0.10",
  "scanpy>=1.10",
  "scrublet>=0.2.3",
  "harmonypy>=0.0.9"
]
workflow = ["snakemake>=8"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
perturbseq-pipeline = "perturbseq_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

