name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Validation fixture smoke test
        run: |
          perturbseq-pipeline make-demo --outdir demo
          test -s demo/expression_counts.csv
          test -s demo/perturbseq_feature_matrix.h5ad

  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: Install CRAN runtime packages
        shell: bash -el {0}
        run: Rscript workflow/scripts/install_r_packages.R
      - name: Run complete validation workflow
        shell: bash -el {0}
        run: snakemake --snakefile workflow/Snakefile --configfile config/demo_h5ad.yaml --cores 2
      - name: Verify final report
        shell: bash -el {0}
        run: test -s results/final_reports/summary_dashboard.html
